name: Code QA

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Run tests
        run: Rscript -e 'testthat::test_local()'

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: check

      - name: Check documentation is current
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code

  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::styler
          needs: check

      - name: Check formatting
        run: |
          Rscript -e 'styler::style_pkg(transformers = styler::tidyverse_style(indent_by = 4L))'
          git diff --exit-code
